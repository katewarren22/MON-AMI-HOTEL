<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Mon Ami Hotel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">MON <span class="gold">AMI</span> HOTEL - PAYMENT</span><a href="index.html" class="btn btn-outline-light btn-sm">← Back</a></div></nav>

<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6">
<div class="card p-4 rounded-4 shadow">
<h4 class="fw-bold">Confirm & Pay</h4>
<div id="summary" class="bg-light p-3 rounded-3 mb-3"></div>

<label class="fw-bold">Choose Payment Method</label>
<div class="row g-2 my-2">
<div class="col-6"><button type="button" onclick="selectPay('MTN MoMo', this)" class="btn btn-outline-warning w-100 pay-btn active">🟡 MTN MoMo</button></div>
<div class="col-6"><button type="button" onclick="selectPay('Airtel Money', this)" class="btn btn-outline-danger w-100 pay-btn">🔴 Airtel Money</button></div>
</div>

<label>Mobile Money Number</label><input id="momoNum" type="tel" class="form-control mb-3" placeholder="0702040084 or 0774881921">
<p class="small text-muted">You will receive a prompt on your phone to enter your Mobile Money PIN.</p>
<button id="payBtn" onclick="payNow()" class="btn btn-gold w-100">Pay Now</button>
<div id="msg" class="mt-3"></div>

<!-- SUCCESS ACTIONS - Hidden until payment succeeds -->
<div id="successActions" style="display:none;" class="mt-3">
  <hr>
  <h6 class="fw-bold text-success">✅ Payment Successful!</h6>
  <div class="d-grid gap-2">
    <a id="whatsappBtn" href="#" target="_blank" class="btn btn-success">💬 Send Confirmation on WhatsApp</a>
    <button onclick="downloadReceipt()" class="btn btn-dark">📄 Download PDF Receipt</button>
    <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
  </div>
  <p class="small text-muted mt-2">Hotel WhatsApp: 0702040084 | 0774881921<br>Your booking is already saved in Admin Dashboard.</p>
</div>

</div></div></div></div>

<script>
let method = 'MTN MoMo';
let b = JSON.parse(localStorage.getItem('pendingBooking') || '{}');
let ref = 'MA-' + Math.floor(1000 + Math.random()*9000);

if(!b.name){ document.getElementById('summary').innerHTML = 'No booking found. <a href="index.html">Book first</a>'; }
else{
  document.getElementById('summary').innerHTML = `<b>${b.name}</b> (${b.phone})<br>${b.room} • ${b.nights} Night(s) • ${b.guests}<br>${b.checkin} to ${b.checkout}<br><h5 class="mt-2">Total: UGX ${b.total.toLocaleString()}</h5>`;
  document.getElementById('momoNum').value = b.phone;
}

function selectPay(m, btn){ method = m; document.querySelectorAll('.pay-btn').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); }

function payNow(){
  let num = document.getElementById('momoNum').value;
  if(!num || num.length < 10){ alert('Enter a valid Mobile Money number'); return; }
  document.getElementById('payBtn').innerHTML = 'Processing... Please wait...';
  document.getElementById('payBtn').disabled = true;
  document.getElementById('msg').innerHTML = `<div class="alert alert-info">⏳ Sending prompt to <b>${num}</b> via <b>${method}</b>... Please enter your PIN on your phone...</div>`;

  setTimeout(()=>{
    // 1. Save to Admin
    let all = JSON.parse(localStorage.getItem('monami_bookings') || '[]');
    b.payment = method; b.momo = num; b.status = 'Confirmed'; b.ref = ref; b.date = new Date().toLocaleString();
    all.push(b); localStorage.setItem('monami_bookings', JSON.stringify(all));
    localStorage.removeItem('pendingBooking');

    // 2. Show success
    document.getElementById('msg').innerHTML = `<div class="alert alert-success">✅ Payment Successful! UGX ${b.total.toLocaleString()} received via ${method}.<br>Booking Ref: <b>${ref}</b></div>`;
    document.getElementById('payBtn').style.display = 'none';

    // 3. Build WhatsApp Message
    let msg = `Hello Mon Ami Hotel!%0A%0AI have just paid for my booking:%0A%0A*Name:* ${b.name}%0A*Room:* ${b.room}%0A*Check-In:* ${b.checkin}%0A*Check-Out:* ${b.checkout}%0A*Nights:* ${b.nights}%0A*Total Paid:* UGX ${b.total.toLocaleString()}%0A*Payment:* ${method} (${num})%0A*Ref:* ${ref}%0A%0APlease confirm my booking. Thank you!`;
    // Hotel WhatsApp numbers
    document.getElementById('whatsappBtn').href = `https://wa.me/256702040084?text=${msg}`;
    document.getElementById('successActions').style.display = 'block';
  }, 2500);
}

function downloadReceipt(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(20); doc.text("MON AMI HOTEL", 60, 20);
  doc.setFontSize(11); doc.text("Mukirania Street, Kasese, Uganda", 55, 28);
  doc.text("Tel: 0702040084 | 0774881921", 55, 34);
  doc.line(10, 38, 200, 38);
  doc.setFontSize(14); doc.text("OFFICIAL RECEIPT", 75, 48);
  doc.setFontSize(11);
  doc.text(`Receipt Ref: ${ref}`, 15, 60);
  doc.text(`Date: ${new Date().toLocaleString()}`, 15, 68);
  doc.text(`Guest Name: ${b.name}`, 15, 78);
  doc.text(`Phone: ${b.phone}`, 15, 86);
  doc.text(`Room Type: ${b.room}`, 15, 96);
  doc.text(`Check-In: ${b.checkin}`, 15, 104);
  doc.text(`Check-Out: ${b.checkout}`, 15, 112);
  doc.text(`Nights: ${b.nights} | Guests: ${b.guests}`, 15, 120);
  doc.text(`Payment Method: ${method} (${b.momo})`, 15, 130);
  doc.setFontSize(13); doc.text(`TOTAL PAID: UGX ${b.total.toLocaleString()}`, 15, 145);
  doc.setFontSize(10); doc.text("Status: PAID - CONFIRMED", 15, 155);
  doc.text("Thank you for choosing Mon Ami Hotel. Stay like you are with a friend!", 15, 170);
  doc.text("--------------------------------------------------", 15, 180);
  doc.text("Manager Signature: ___________________", 15, 190);
  doc.save(`Mon-Ami-Receipt-${ref}.pdf`);
}
</script>
</body></html>
