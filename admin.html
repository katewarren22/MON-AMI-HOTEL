<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mon Ami Hotel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">MON <span class="gold">AMI</span> HOTEL - ADMIN</span><a href="index.html" class="btn btn-outline-light btn-sm">View Site</a></div></nav>
<div class="container py-4">
<h2>Welcome Back, Manager 👋</h2><p class="text-muted">Live bookings from website + Mobile Money</p>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="card p-3 text-center"><h3 id="totalB">0</h3><p>Total Bookings</p></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><h3 id="totalR" class="text-success">UGX 0</h3><p>Total Revenue</p></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><button onclick="clearAll()" class="btn btn-outline-danger btn-sm">Clear All Bookings</button></div></div></div>
<h4>All Bookings</h4>
<div class="table-responsive"><table class="table table-striped table-bordered bg-white"><thead class="table-dark"><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Payment</th><th>Total</th><th>Status</th></tr></thead><tbody id="bookTable"></tbody></table></div>
<p class="text-muted small">Demo bookings are also included below if you have not booked yet.</p>
</div>
<script>
let demo = [
 {name:'Sarah Nakato', phone:'0702040084', room:'Deluxe Double', checkin:'2026-11-18', checkout:'2026-11-20', nights:2, total:500000, payment:'MTN MoMo', status:'Confirmed'},
 {name:'John Mukasa', phone:'0774881921', room:'Executive King', checkin:'2026-11-19', checkout:'2026-11-22', nights:3, total:1050000, payment:'Airtel Money', status:'Confirmed'}
];
let real = JSON.parse(localStorage.getItem('monami_bookings') || '[]');
let all = [...real, ...demo];
let html = ''; let sum = 0;
all.forEach(b=>{ sum += b.total; html += `<tr><td>${b.name}<br><small>${b.phone}</small></td><td>${b.room}<br><small>${b.nights} night(s)</small></td><td>${b.checkin} → ${b.checkout}</td><td>${b.payment || 'MoMo'}</td><td>UGX ${b.total.toLocaleString()}</td><td><span class="badge bg-success">${b.status}</span></td></tr>`; });
document.getElementById('bookTable').innerHTML = html;
document.getElementById('totalB').innerText = all.length;
document.getElementById('totalR').innerText = 'UGX ' + sum.toLocaleString();
function clearAll(){ localStorage.removeItem('monami_bookings'); location.reload(); }
</script></body></html>
